<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #fff;
    --text: #202124;
    --text-muted: #5f6368;
    --border: #e8eaed;
    --hover: #f1f3f4;
    --disabled: #9aa0a6;
    --error: #c5221f;
    --status: #1a73e8;
    --avatar-bg: #7b61ff;
    --incognito-bg: #3c4043;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #292a2d;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --border: #3c4043;
      --hover: #35363a;
      --disabled: #70757a;
      --error: #f28b82;
      --status: #8ab4f8;
      --avatar-bg: #8b7bff;
      --incognito-bg: #5f6368;
    }
  }
  body {
    width: 260px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
  }
  .header {
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row.disabled { cursor: default; color: var(--disabled); }
  .row.disabled:hover { background: none; }
  .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: var(--avatar-bg);
    flex-shrink: 0;
    object-fit: cover;
  }
  .avatar.incognito { background: var(--incognito-bg); }
  .sep { border-top: 1px solid var(--border); margin: 4px 0; }
  .error { padding: 12px 14px; color: var(--error); font-size: 12px; line-height: 1.5; }
  .status { padding: 10px 14px; font-size: 12px; color: var(--status); }
  .footer {
    padding: 8px 14px;
    font-size: 11px;
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--status); text-decoration: none; cursor: pointer; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="header" id="header">Open tab in&hellip;</div>
  <div id="list"></div>
  <div class="footer"><a id="settings-link">Settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
