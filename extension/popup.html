<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #fff;
    --text: #1f1f24;
    --text-secondary: #6b6b76;
    --border: #ececf1;
    --hover: #f4f2fb;
    --accent: #6c47ff;
    --accent-soft: #efeaff;
    --accent-text: #5233d6;
    --danger: #d93025;
    --incognito-bg: #2c2c34;
    --avatar-ring: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e24;
      --text: #f1f0f5;
      --text-secondary: #a6a5b0;
      --border: #34343e;
      --hover: #2f2f38;
      --accent: #9c7dff;
      --accent-soft: #362c54;
      --accent-text: #c3b0ff;
      --danger: #f28b82;
      --incognito-bg: #3a3a44;
      --avatar-ring: #1e1e24;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 288px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 12px;
  }
  .badge {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-text));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .badge svg { width: 15px; height: 15px; }
  .header-text { min-width: 0; }
  .title { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .subtitle { font-size: 11px; color: var(--text-secondary); line-height: 1.3; }
  .list { padding: 2px 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .row:hover { background: var(--hover); }
  .row:active { transform: scale(0.98); }
  .row.disabled { cursor: default; color: var(--text-secondary); }
  .row.disabled:hover { background: none; }
  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    flex-shrink: 0;
    object-fit: cover;
    box-shadow: 0 0 0 1.5px var(--avatar-ring), 0 0 0 2.5px var(--border);
  }
  .avatar.incognito {
    background: var(--incognito-bg);
    box-shadow: 0 0 0 1.5px var(--avatar-ring), 0 0 0 2.5px var(--border);
  }
  .avatar.incognito svg { width: 14px; height: 14px; }
  .row-label { font-size: 13px; font-weight: 500; }
  .sep { border-top: 1px solid var(--border); margin: 6px 4px; }
  .error {
    margin: 4px 8px;
    padding: 10px 12px;
    background: var(--hover);
    border-radius: 10px;
    color: var(--danger);
    font-size: 12px;
    line-height: 1.5;
  }
  .footer {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 11.5px;
    cursor: pointer;
    transition: color 120ms ease;
  }
  .footer:hover { color: var(--text); }
  .footer svg { width: 13px; height: 13px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="header">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8c2-3 6-4 9-2.5M4 8l1-3.5M4 8l3.3 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 16c-2 3-6 4-9 2.5M20 16l-1 3.5M20 16l-3.3-1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="title" id="title">Open tab in</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="footer" id="settings-link">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.8"/>
      <path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.5-2-3.4-2.2.9c-.4-.3-.8-.6-1.3-.8L15.4 5h-4l-.4 2.2c-.5.2-.9.5-1.3.8l-2.2-.9-2 3.4L7.4 12c-.1.5-.1 1 0 1.5l-1.9 1.5 2 3.4 2.2-.9c.4.3.8.6 1.3.8l.4 2.2h4l.4-2.2c.5-.2.9-.5 1.3-.8l2.2.9 2-3.4-1.9-1.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    Settings
  </div>
  <script src="popup.js"></script>
</body>
</html>
