<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 260px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: #202124;
  }
  .header {
    padding: 10px 14px;
    font-size: 12px;
    color: #5f6368;
    border-bottom: 1px solid #e8eaed;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .row:hover { background: #f1f3f4; }
  .row.disabled { cursor: default; color: #9aa0a6; }
  .row.disabled:hover { background: none; }
  .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: #7b61ff;
    flex-shrink: 0;
  }
  .avatar.incognito { background: #3c4043; }
  .sep { border-top: 1px solid #e8eaed; margin: 4px 0; }
  .error { padding: 12px 14px; color: #c5221f; font-size: 12px; line-height: 1.5; }
  .status { padding: 10px 14px; font-size: 12px; color: #1a73e8; }
</style>
</head>
<body>
  <div class="header" id="header">Open tab in&hellip;</div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
