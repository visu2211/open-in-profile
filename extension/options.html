<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Open Tab in Profile - Settings</title>
<style>
  :root {
    --bg: #f7f6fb;
    --surface: #fff;
    --text: #1f1f24;
    --text-secondary: #6b6b76;
    --border: #ececf1;
    --hover: #f4f2fb;
    --accent: #6c47ff;
    --accent-soft: #efeaff;
    --accent-text: #5233d6;
    --success-bg: #eaf7ee;
    --success-text: #1e8e3e;
    --shadow: 0 1px 2px rgba(20, 20, 30, 0.04), 0 8px 24px rgba(20, 20, 30, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171b;
      --surface: #221f28;
      --text: #f1f0f5;
      --text-secondary: #a6a5b0;
      --border: #322f3a;
      --hover: #2b2833;
      --accent: #9c7dff;
      --accent-soft: #33294d;
      --accent-text: #c3b0ff;
      --success-bg: #16301f;
      --success-text: #7cd992;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 56px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .app-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-text));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  .app-icon svg { width: 24px; height: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  p.sub {
    font-size: 13.5px;
    color: var(--text-secondary);
    margin: 2px 0 0;
    line-height: 1.5;
  }
  .card {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 8px;
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 2px;
    cursor: pointer;
    transition: background 120ms ease, box-shadow 120ms ease;
    border: 1.5px solid transparent;
  }
  .row:last-child { margin-bottom: 0; }
  .row:hover { background: var(--hover); }
  .row.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    flex-shrink: 0;
    object-fit: cover;
  }
  .name { font-size: 13.5px; font-weight: 500; flex: 1; }
  .radio {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    position: relative;
    transition: border-color 120ms ease;
  }
  .row.selected .radio { border-color: var(--accent); }
  .row.selected .radio::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--accent);
  }
  .empty {
    padding: 20px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-secondary);
    min-height: 20px;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .status.visible { opacity: 1; transform: translateY(0); }
  .status.saved { color: var(--success-text); }
  .status svg { width: 15px; height: 15px; flex-shrink: 0; }
  .footnote {
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="app-header">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8c2-3 6-4 9-2.5M4 8l1-3.5M4 8l3.3 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 16c-2 3-6 4-9 2.5M20 16l-1 3.5M20 16l-3.3-1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Open Tab in Profile</h1>
        <p class="sub">Pick which Chrome profile this is, so it can be left out of the list.</p>
      </div>
    </div>

    <div class="card" id="list"></div>
    <div class="status" id="status"></div>

    <p class="footnote">Sending a tab to your own current profile doesn't do anything useful, so it's hidden once you pick it here. Nothing on this page ever leaves your machine.</p>
  </div>
  <script src="options.js"></script>
</body>
</html>
